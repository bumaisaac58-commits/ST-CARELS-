<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>St Carels Academy - Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      color: #1f2937;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #0d47a1;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 28px;
    }
    h1 {
      margin: 0 0 6px;
      text-align: center;
      color: #0d47a1;
      font-size: 24px;
    }
    .school-name {
      margin: 0 0 28px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 14px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 2px rgba(25,118,210,0.1);
    }
    .password-box { position: relative; }
    .password-box input { padding-right: 52px; }
    .show-password {
      position: absolute;
      right: 14px;
      top: 14px;
      cursor: pointer;
      color: #1976d2;
      font-size: 13px;
      user-select: none;
    }
    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #0d47a1;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }
    .login-btn:hover { background: #083579; }
    .forgot {
      text-align: right;
      margin: 12px 0 20px;
    }
    .forgot a {
      color: #1976d2;
      text-decoration: none;
      font-size: 14px;
    }
    .message {
      margin-top: 14px;
      text-align: center;
      color: #d32f2f;
      font-size: 14px;
      min-height: 20px;
    }
    .footer {
      margin-top: 24px;
      text-align: center;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">SC</div>
    <h1>St Carels Academy</h1>
    <p class="school-name">School Management System</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-box">
          <input type="password" id="password" placeholder="Enter your password" required />
          <span class="show-password" onclick="togglePassword()">Show</span>
        </div>
      </div>

      <div class="forgot">
        <a href="#" onclick="forgotPassword(); return false;">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">LOGIN</button>
      <div id="message" class="message" aria-live="polite"></div>
    </form>

    <div class="footer">
      <p>Excellency via faith</p>
      <p>© 2026 St Carels Academy</p>
    </div>
  </div>

  <script>
    const DEMO_SESSION_KEY = 'stcarels-demo-session';

    function togglePassword() {
      const password = document.getElementById('password');
      const button = document.querySelector('.show-password');
      const isPassword = password.type === 'password';
      password.type = isPassword ? 'text' : 'password';
      button.textContent = isPassword ? 'Hide' : 'Show';
    }

    function forgotPassword() {
      alert('Please contact the school administrator to reset your password.');
    }

    function setDemoSession(email) {
      localStorage.setItem(DEMO_SESSION_KEY, JSON.stringify({ email, loggedInAt: Date.now() }));
    }

    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const message = document.getElementById('message');

      if (!email || !password) {
        message.style.color = '#d32f2f';
        message.textContent = 'Please enter your email and password.';
        return;
      }

      const validDemoUser = email === 'admin@stcarels.com' && password === 'admin123';

      if (validDemoUser) {
        message.style.color = 'green';
        message.textContent = 'Login successful...';
        setDemoSession(email);

        setTimeout(function () {
          window.location.href = 'dashboard.html';
        }, 700);
      } else {
        message.style.color = '#d32f2f';
        message.textContent = 'Invalid email or password.';
      }
    });
  </script>
</body>
</html>
