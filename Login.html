<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>St Carels Academy - Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      color: #1f2937;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #0d47a1;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 28px;
    }
    h1 {
      margin: 0 0 6px;
      text-align: center;
      color: #0d47a1;
      font-size: 24px;
    }
    .school-name {
      margin: 0 0 28px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 14px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 2px rgba(25,118,210,0.1);
    }
    input:disabled {
      background: #f5f5f5;
      cursor: not-allowed;
    }
    .password-box { position: relative; }
    .password-box input { padding-right: 52px; }
    .show-password {
      position: absolute;
      right: 14px;
      top: 14px;
      cursor: pointer;
      color: #1976d2;
      font-size: 13px;
      user-select: none;
    }
    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #0d47a1;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.3s;
    }
    .login-btn:hover:not(:disabled) { background: #083579; }
    .login-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .forgot {
      text-align: right;
      margin: 12px 0 20px;
    }
    .forgot a {
      color: #1976d2;
      text-decoration: none;
      font-size: 14px;
    }
    .message {
      margin-top: 14px;
      text-align: center;
      color: #d32f2f;
      font-size: 14px;
      min-height: 20px;
      padding: 8px;
      border-radius: 4px;
    }
    .message.success {
      color: #27ae60;
      background: #d5f4e6;
    }
    .message.error {
      color: #d32f2f;
      background: #fadbd8;
    }
    .message.loading {
      color: #1976d2;
      background: #d6eaf8;
    }
    .footer {
      margin-top: 24px;
      text-align: center;
      color: #777;
      font-size: 12px;
    }
    .demo-notice {
      background: #fff3cd;
      color: #856404;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 16px;
      border-left: 4px solid #ffc107;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">SC</div>
    <h1>St Carels Academy</h1>
    <p class="school-name">School Management System</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-box">
          <input type="password" id="password" placeholder="Enter your password" required />
          <span class="show-password" onclick="togglePassword()">Show</span>
        </div>
      </div>

      <div class="forgot">
        <a href="#" onclick="forgotPassword(); return false;">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">LOGIN</button>
      <div id="message" class="message" aria-live="polite"></div>
    </form>

    <div class="demo-notice">
      <strong>Demo Account:</strong><br>
      Email: admin@stcarels.com<br>
      Password: admin123
    </div>

    <div class="footer">
      <p>Excellency via faith</p>
      <p>© 2026 St Carels Academy</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="Supabase.js"></script>
  <script>
    'use strict';

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const messageDiv = document.getElementById('message');
    const loginBtn = document.getElementById('loginBtn');

    function togglePassword() {
      const password = document.getElementById('password');
      const button = document.querySelector('.show-password');
      const isPassword = password.type === 'password';
      password.type = isPassword ? 'text' : 'password';
      button.textContent = isPassword ? 'Hide' : 'Show';
    }

    function showMessage(text, type = 'error') {
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + type;
    }

    function forgotPassword() {
      alert('Please contact the school administrator at admin@stcarels.com to reset your password.');
    }

    async function handleLogin(event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        showMessage('Please enter your email and password.', 'error');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      showMessage('Authenticating...', 'loading');

      try {
        const db = window.supabaseClient;

        if (!db) {
          throw new Error('Authentication service not available. Please refresh the page.');
        }

        const { data, error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error('Login failed: No user returned.');
        }

        showMessage('Login successful! Redirecting...', 'success');
        console.log('✅ User signed in:', data.user.email);

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);

      } catch (error) {
        console.error('❌ Login error:', error);
        let errorMsg = error.message || 'Invalid email or password.';
        
        if (error.message.includes('Invalid login credentials')) {
          errorMsg = 'Invalid email or password.';
        } else if (error.message.includes('Email not confirmed')) {
          errorMsg = 'Please verify your email first.';
        }

        showMessage(errorMsg, 'error');
        loginBtn.disabled = false;
        loginBtn.textContent = 'LOGIN';
      }
    }

    loginForm.addEventListener('submit', handleLogin);

    // Check if user is already logged in
    (async () => {
      try {
        const db = window.supabaseClient;
        if (!db) return;

        const { data } = await db.auth.getUser();
        if (data.user) {
          console.log('User already logged in, redirecting to dashboard...');
          window.location.href = 'dashboard.html';
        }
      } catch (error) {
        console.error('Session check error:', error);
      }
    })();
  </script>
</body>
</html>
